<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kauçuk Hesap</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaplama">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#ea580c; --accent-2:#fff7ed; --input:#f9fafb; --warn:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0f14; --card:#161b22; --text:#f3f4f6; --muted:#9ca3af; --line:#2a313b;
         --accent:#fb923c; --accent-2:#2a1a0e; --input:#0f141a; --warn:#f87171; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:6px 2px 12px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.tab{border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;
  padding:10px 4px;border-radius:9px}
.tab.on{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;
  border:1px solid var(--line)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field{position:relative}
input{width:100%;font-size:20px;padding:12px 44px 12px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--input);color:var(--text);outline:none;
  font-variant-numeric:tabular-nums;appearance:none}
input:focus{border-color:var(--accent)}
.unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:14px;color:var(--muted);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--input);color:var(--text);
  border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.result{background:var(--accent-2);border-color:transparent}
.big{font-size:34px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;margin:2px 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);
  font-size:15px;font-variant-numeric:tabular-nums}
.row:first-child{border-top:none}
.row span:first-child{color:var(--muted)}
.warn{color:var(--warn);font-size:14px;margin:0 0 8px}
.btns{display:flex;gap:10px;margin-top:12px}
button.main{flex:1;font-size:16px;font-weight:600;padding:13px;border-radius:12px;border:none;
  background:var(--accent);color:#fff}
button.ghost{flex:1;font-size:16px;font-weight:600;padding:13px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--text)}
.hist-item{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.hist-item:first-child{border-top:none}
.hist-item .t{flex:1;font-size:14px}
.hist-item .t b{font-size:16px}
.hist-item .s{color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);
  border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.del{border:none;background:none;color:var(--muted);font-size:20px;padding:4px 8px}
.empty{color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kauçuk Hesap</h1>

  <div class="tabs" role="tablist">
    <button class="tab" data-m="tambur">Tambur</button>
    <button class="tab" data-m="profil">Profil</button>
    <button class="tab" data-m="silindir">Silindir</button>
  </div>

  <!-- Tambur kaplama -->
  <div class="card" data-sec="tambur">
    <h2>Tambur kaplama</h2>
    <div class="grid">
      <div>
        <label for="d">Tambur çapı (çıplak)</label>
        <div class="field"><input id="d" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div>
        <label for="l">Kaplama boyu</label>
        <div class="field"><input id="l" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div>
        <label for="t">Kauçuk kalınlığı</label>
        <div class="field"><input id="t" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
    </div>
  </div>

  <!-- Dörtgen kesitli profil -->
  <div class="card" data-sec="profil" hidden>
    <h2>Dörtgen kesitli profil</h2>
    <div class="grid">
      <div>
        <label for="pw">Genişlik</label>
        <div class="field"><input id="pw" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div>
        <label for="ph">Yükseklik</label>
        <div class="field"><input id="ph" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div>
        <label for="pl">Uzunluk</label>
        <div class="field"><input id="pl" inputmode="decimal" placeholder="0"><span class="unit">m</span></div>
      </div>
    </div>
  </div>

  <!-- İçi boş silindir -->
  <div class="card" data-sec="silindir" hidden>
    <h2>İçi boş silindir</h2>
    <div class="grid">
      <div>
        <label for="so">Dış çap</label>
        <div class="field"><input id="so" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div>
        <label for="si">İç çap</label>
        <div class="field"><input id="si" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div>
        <label for="sl">Boy</label>
        <div class="field"><input id="sl" inputmode="decimal" placeholder="0"><span class="unit">mm</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Kauçuk ve fiyat</h2>
    <div class="grid">
      <div class="full">
        <label for="rho">Kauçuk yoğunluğu</label>
        <div class="field"><input id="rho" inputmode="decimal" value="1,20"><span class="unit">g/cm³</span></div>
        <div class="chips" id="rhoChips">
          <button class="chip" data-v="1,15">1,15</button>
          <button class="chip" data-v="1,20">1,20</button>
          <button class="chip" data-v="1,30">1,30</button>
          <button class="chip" data-v="1,45">1,45</button>
        </div>
      </div>
      <div>
        <label for="q">Adet</label>
        <div class="field"><input id="q" inputmode="numeric" value="1"><span class="unit">ad</span></div>
      </div>
      <div>
        <label for="fire">Fire payı</label>
        <div class="field"><input id="fire" inputmode="decimal" value="0"><span class="unit">%</span></div>
      </div>
      <div class="full">
        <label for="p">Kg fiyatı</label>
        <div class="field"><input id="p" inputmode="decimal" placeholder="0"><span class="unit">₺</span></div>
      </div>
    </div>
  </div>

  <div class="card result">
    <h2>Sonuç</h2>
    <div class="big" id="total">0,00 ₺</div>
    <div class="warn" id="warn" hidden></div>
    <div id="rows"></div>
    <div class="btns">
      <button class="ghost" id="clear">Temizle</button>
      <button class="main" id="save">Kaydet</button>
    </div>
    <div class="note" id="formula"></div>
  </div>

  <div class="card">
    <h2>Kayıtlar</h2>
    <div id="hist"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (n, d=2) => n.toLocaleString('tr-TR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtMm = n => fmt(n, n % 1 ? 1 : 0);
const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;

const shared = ['q','rho','fire','p'];
const modeInputs = { tambur:['d','l','t'], profil:['pw','ph','pl'], silindir:['so','si','sl'] };
const allIds = [...shared, ...Object.values(modeInputs).flat()];
const labels = { tambur:'Tambur', profil:'Profil', silindir:'Silindir' };

function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }

let mode = load('mode', 'tambur');
if(!modeInputs[mode]) mode = 'tambur';
let last = null;

// Her bölüm: 1 adet için hacim (dm³), ek satırlar, açıklama ve kayıt özeti.
const modes = {
  tambur(){
    const D = num($('d').value), L = num($('l').value), T = num($('t').value);
    const Do = D + 2*T;
    const vol = Math.PI/4 * (Do*Do - D*D) * L / 1e6;
    return { vol, dims:{D,L,T},
      rows: w1 => [
        ['Kaplamalı çap', fmtMm(Do) + ' mm'],
        ['Kaplama alanı (1 adet)', fmt(Math.PI * D * L / 1e6) + ' m²'],
        ['Hacim (1 adet)', fmt(vol) + ' dm³'] ],
      formula: 'Hesap: π/4 × ((Çap + 2×Kalınlık)² − Çap²) × Boy × Yoğunluk. Tamburun yan yüzleri dahil değildir.' };
  },
  profil(){
    const W = num($('pw').value), H = num($('ph').value), L = num($('pl').value);
    const vol = W * H * (L * 1000) / 1e6;
    const rho = num($('rho').value);
    return { vol, dims:{W,H,L},
      rows: w1 => [
        ['Metre ağırlığı', fmt(W * H / 1000 * rho) + ' kg/m'],
        ['Kesit alanı', fmt(W * H / 100) + ' cm²'],
        ['Hacim (1 adet)', fmt(vol) + ' dm³'] ],
      formula: 'Hesap: Genişlik × Yükseklik × Uzunluk × Yoğunluk.' };
  },
  silindir(){
    const Do = num($('so').value), Di = num($('si').value), L = num($('sl').value);
    const bad = Di > 0 && Do > 0 && Di >= Do;
    const vol = bad ? 0 : Math.PI/4 * (Do*Do - Di*Di) * L / 1e6;
    return { vol, dims:{Do,Di,L},
      warn: bad ? 'İç çap, dış çaptan küçük olmalı.' : '',
      rows: w1 => [
        ['Et kalınlığı', fmtMm(Math.max(0, (Do - Di) / 2)) + ' mm'],
        ['Hacim (1 adet)', fmt(vol) + ' dm³'] ],
      formula: 'Hesap: π/4 × (Dış çap² − İç çap²) × Boy × Yoğunluk.' };
  }
};

function describe(r){
  const m = r.mode || 'tambur', x = r.dims || r;
  if(m === 'profil') return `${fmtMm(x.W)} × ${fmtMm(x.H)} mm, ${fmt(x.L, x.L % 1 ? 2 : 0)} m`;
  if(m === 'silindir') return `Ø${fmtMm(x.Do)} / Ø${fmtMm(x.Di)} × ${fmtMm(x.L)} mm`;
  return `Ø${fmtMm(x.D)} × ${fmtMm(x.L)} mm, ${fmt(x.T, 1)} mm kauçuk`;
}

function calc(){
  const Q = Math.max(1, Math.round(num($('q').value)) || 1);
  const rho = num($('rho').value), fire = num($('fire').value), P = num($('p').value);
  const r = modes[mode]();
  const w1 = r.vol * rho;                   // g/cm³ = kg/dm³
  const wt = w1 * Q * (1 + fire/100);
  const total = wt * P;

  $('total').textContent = fmt(total) + ' ₺';
  $('warn').hidden = !r.warn; $('warn').textContent = r.warn || '';
  $('rows').innerHTML = [
    ['Kauçuk ağırlığı (1 adet)', fmt(w1) + ' kg'],
    ['Toplam ağırlık (fire dahil)', fmt(wt) + ' kg'],
    ...r.rows(w1)
  ].map(([a,b]) => row(a,b)).join('');
  $('formula').textContent = r.formula;

  document.querySelectorAll('#rhoChips .chip').forEach(c =>
    c.classList.toggle('on', num(c.dataset.v) === rho));

  last = { mode, dims:r.dims, Q, rho, fire, P, w1, wt, total, ts: Date.now() };
  store('inputs', Object.fromEntries(allIds.map(i => [i, $(i).value])));
}

function setMode(m){
  mode = m; store('mode', m);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
  document.querySelectorAll('[data-sec]').forEach(s => s.hidden = s.dataset.sec !== m);
  calc();
}

function renderHist(){
  const h = load('hist', []);
  const el = $('hist');
  if(!h.length){ el.innerHTML = '<div class="empty">Henüz kayıt yok.</div>'; return; }
  el.innerHTML = h.map((r, i) => `
    <div class="hist-item">
      <div class="t">
        <span class="tag">${labels[r.mode || 'tambur']}</span><b>${fmt(r.total)} ₺</b> · ${fmt(r.wt)} kg
        <div class="s">${describe(r)}, ${r.Q} ad, ${fmt(r.P)} ₺/kg
        · ${new Date(r.ts).toLocaleDateString('tr-TR')}</div>
      </div>
      <button class="del" data-i="${i}" aria-label="Sil">×</button>
    </div>`).join('');
  el.querySelectorAll('.del').forEach(b => b.onclick = () => {
    const h2 = load('hist', []); h2.splice(+b.dataset.i, 1); store('hist', h2); renderHist();
  });
}

// başlangıç
const saved = load('inputs', null);
if(saved) allIds.forEach(i => { if(saved[i] !== undefined) $(i).value = saved[i]; });
allIds.forEach(i => $(i).addEventListener('input', calc));
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setMode(t.dataset.m));
document.querySelectorAll('#rhoChips .chip').forEach(c =>
  c.onclick = () => { $('rho').value = c.dataset.v; calc(); });
$('save').onclick = () => {
  if(!last || (last.total <= 0 && last.wt <= 0)) return;
  const h = load('hist', []); h.unshift(last); store('hist', h.slice(0, 50)); renderHist();
  $('save').textContent = 'Kaydedildi ✓'; setTimeout(() => $('save').textContent = 'Kaydet', 1200);
};
$('clear').onclick = () => {
  [...modeInputs[mode], 'p'].forEach(i => $(i).value = ''); $('q').value = '1'; calc();
};

setMode(mode); renderHist();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
